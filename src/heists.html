---
title: Heists
---
{% include head.html %}

<div class="content">
  {% assign heists = collections.heists | reverse %}
  {% for heist in heists %}

  <article>
    <iframe
      style="border: 0"
      src="https://bandcamp.com/EmbeddedPlayer/{{heist.data.type}}={{ heist.data.key }}/size=large/bgcol=333333/linkcol=f171a2/minimal=true/transparent=true/"
      seamless
    >
      <a
        href="https://spacethief.bandcamp.com/{{heist.data.type}}/{{ heist.data.title | slugify }}"
        >{{ heist.data.title }} by Space Thief</a
      >
    </iframe>
    <footer>
      <span
        ><a
          href="https://spacethief.bandcamp.com/{{heist.data.type}}/{{ heist.data.title | slugify }}"
          >{{ heist.data.title }}</a
        ></span
      >
      <span>{{ heist.date | date: '%b %Y' }}</span>
    </footer>
  </article>

  {% endfor %}
</div>
<a class="more" href="https://spacethief.bandcamp.com">More!</a>

{% include foot.html %}
