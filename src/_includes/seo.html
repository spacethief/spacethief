{% assign canonical = site.url | append: page.url %}
<link rel="canonical" href="{{ canonical | escape }}">
<meta property="og:title" content="{{ pageTitle | escape }}">
<meta property="og:description" content="{{ description | escape }}">
<meta property="og:url" content="{{ canonical | escape }}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:locale" content="en_US">
<meta property="og:type" content="{% if seoType == 'article' %}article{% else %}website{% endif %}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ pageTitle | escape }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "{% if seoType == 'article' %}Article{% else %}WebSite{% endif %}",
  "headline": {{ pageTitle | json }},
  "description": {{ description | json }},
  "url": {{ canonical | json }}
}
</script>
