permalink: /:title/
title: Space Thief
description: Songs from an eclectic galaxy.

media: "/assets/images/"

linkopener: 'target="_blank" rel="noopener noreferrer"'

collections:
  heists:
    output: false

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - '*.code-workspace'
  - _excludes/
